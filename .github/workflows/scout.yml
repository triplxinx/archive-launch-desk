name: Scout employer boards
on:
  push:
    branches: [main]
    paths: ["scout/**", ".github/workflows/scout.yml"]
  workflow_dispatch:
  pull_request:
    paths: ["scout/**", ".github/workflows/scout.yml"]
  schedule:
    - cron: "17 16 * * *"
permissions:
  contents: read
concurrency:
  group: archive-scout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scout/scout.test.mjs
      - run: node scout/scout.mjs
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.SUPABASE_URL != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
